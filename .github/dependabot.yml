version: 2
updates:
  # Dependências de desenvolvimento (esbuild, html-minifier-terser)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5

  # Versões das actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
